services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      - postgres-keycloak
    ports:
      - "8181:8080"
    restart: unless-stopped

  config-server:
    build:
      context: ./Fitness-Backend/ConfigServer
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    restart: unless-stopped

  eureka-service:
    build:
      context: ./Fitness-Backend/EurekaService
      dockerfile: Dockerfile
    depends_on:
      - config-server
    ports:
      - "8761:8761"
    restart: unless-stopped

  user-service:
    build:
      context: ./Fitness-Backend/UserService
      dockerfile: Dockerfile
    depends_on:
      - config-server
      - eureka-service
      - postgres
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"
    restart: unless-stopped

  activity-service:
    build:
      context: ./Fitness-Backend/ActivityService
      dockerfile: Dockerfile
    depends_on:
      - config-server
      - eureka-service
      - mongo
      - kafka
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_DATA_MONGODB_URI: mongodb://mongo:mongo@mongo:27017/demo_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NAME: activity-events
    ports:
      - "8082:8082"
    restart: unless-stopped

  ai-service:
    build:
      context: ./Fitness-Backend/AiService
      dockerfile: Dockerfile
    depends_on:
      - config-server
      - eureka-service
      - mongo
      - kafka
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_DATA_MONGODB_URI: mongodb://mongo:mongo@mongo:27017/demo_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_NAME: activity-events
      GEMINI_URL: ${GEMINI_URL}
      GEMINI_KEY: ${GEMINI_KEY}
    ports:
      - "8083:8083"
    restart: unless-stopped

  gateway-service:
    build:
      context: ./Fitness-Backend/GatewayService
      dockerfile: Dockerfile
    depends_on:
      - config-server
      - eureka-service
      - user-service
      - activity-service
      - ai-service
      - keycloak
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fitness-app/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    restart: unless-stopped

  fitness-frontend:
    build:
      context: ./Fitness-Frontend
      dockerfile: Dockerfile
    depends_on:
      - gateway-service
      - keycloak
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
  mongo_data:
  kafka_data:
